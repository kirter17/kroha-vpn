:root{
  --off:#F1EAE0; --on:#3B59CB; --surround:#E3DACE; --ink:#221E1B; --accent:#3B59CB;
  --muted-off:#776D64; --muted-on:#DCE3FF; --faint:#CDC2B5; --line-off:rgba(70,45,25,.16); --line-on:rgba(255,248,244,.34);
  --sphere-hi:#FBF4EE; --sphere-lo:#E9DBD0; --sand:#F2E2D4;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surround);display:grid;place-items:center;min-height:100dvh;overflow:hidden;font-family:"Onest",system-ui,sans-serif;color:var(--ink);}
.phone{--text:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;--muted:var(--muted-off);--line:var(--line-off);background:var(--off);border-radius:46px;overflow:hidden;
  box-shadow:0 40px 80px -40px rgba(70,45,20,.42);transition:color .35s var(--ease-out)}
.phone.on{--muted:var(--muted-on);--line:var(--line-on);--text:#FFF8F4;transition:color .4s var(--ease-out) .62s}
.wash{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.wash i{position:absolute;width:2000px;height:2000px;left:-1000px;top:-1000px;border-radius:50%;background:var(--on);transform:scale(0);transition:transform .8s cubic-bezier(.55,0,.45,1);will-change:transform}
.on .wash i{transform:scale(1);transition:transform 1.25s cubic-bezier(.42,0,.18,1)}
.phone>:not(.wash):not(.stats):not(.sr):not(.homebar){position:relative;z-index:1}.stats{z-index:1}
.sub,.hint,.c em,.brand small,.stats div,.city,.stats b{transition:color .4s var(--ease-out)}
.on .sub,.on .hint,.on .c em,.on .brand small,.on .stats div,.on .city,.on .stats b{transition:color .4s var(--ease-out) .62s}
.ctry{fill:var(--on);stroke:#221E1B;stroke-width:1.3;stroke-linejoin:round;opacity:0;transition:opacity .5s var(--ease-out)}
.on .ctry{opacity:.92;transition:opacity .6s var(--ease-out) .15s}
.mark,.pill{opacity:0;transition:opacity .35s var(--ease-out)}
.on .mark,.on .pill{opacity:1;transition:opacity .5s var(--ease-out) .35s}
.moving .mark,.moving .pill,.moving .ctry{opacity:0;transition:opacity .2s}
.ring-s{transform-box:fill-box;transform-origin:center;transform:scale(.4);transition:transform .5s var(--ease-out)}
.on .ring-s{transform:none;transition:transform .7s var(--ease-out) .35s}
.ring{fill:none;stroke:var(--on);stroke-width:1.8;stroke-dasharray:3.5 3.5;transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill text{font:600 11px "Onest",system-ui,sans-serif;fill:#221E1B}
.on .trail{stroke:var(--text)}.on #trailDot{fill:var(--text)}.on .notch{background:var(--text)}.on .c svg{box-shadow:0 0 0 1.6px var(--text)}

.sub,.hint,.city,.c em,.brand small,.stats div{transition:color .7s var(--ease-out)}
.fit{position:relative;overflow:hidden}.fit>.phone{position:absolute;left:0;top:0;transform-origin:0 0}
@media (max-width:500px){body{background:var(--off)}.phone{border-radius:0;box-shadow:none}}
.sb{display:flex;justify-content:space-between;align-items:center;height:47px;padding:14px 30px 0 34px;font-size:15px;font-weight:600}
.sb svg{display:block}
.brand{padding:10px 24px 0;font-size:17px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.state{padding:10px 24px 0;height:128px}
.label{font-size:17px;font-weight:500;height:22px;position:relative;overflow:hidden}
.label span,.sub span,.city span{position:absolute;left:0;top:0;white-space:nowrap}
.timer{font-size:52px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;margin-top:10px;color:var(--faint);transition:color .5s var(--ease-out)}
.on .timer{color:var(--text);transition:color .4s var(--ease-out) .62s}
.sub{font-size:14px;color:var(--muted);margin-top:12px;height:18px;position:relative;overflow:hidden}
.swap-in{animation:swapIn .36s var(--ease-out) .16s both}
.swap-out{animation:swapOut .18s var(--ease-in,cubic-bezier(.4,0,1,1)) both}
@keyframes swapIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes swapOut{from{opacity:1}to{transform:translateY(-8px);opacity:0}}
.scene{position:relative;height:calc(318px*var(--s,1));margin-top:4px;touch-action:manipulation}
.scene-in{position:absolute;left:50%;top:0;width:390px;height:318px;transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 0}
.compact .sb{display:none}.compact .brand{padding-top:16px}.compact .state{padding-top:20px;height:112px}.compact .timer{font-size:44px;margin-top:8px}.compact .sub{margin-top:10px}.compact .picker{margin-top:12px}.compact .city{margin-top:8px}.compact .stats{bottom:18px;padding-top:12px}
.scene svg.stage{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rabbit-wrap{position:absolute;left:14px;top:62.5px;width:172px;height:242px;will-change:transform;cursor:pointer}
.rabbit-hop{width:100%;height:100%}
.rabbit-breath{width:100%;height:100%;transform-origin:50% 100%;animation:breath 3.8s var(--ease-io) infinite alternate}
.rabbit-breath img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .7s var(--ease-out) .1s;user-select:none;-webkit-user-drag:none}
.r-sad,.r-happy{transition:none!important}.r-happy{opacity:0}.happy .r-happy{opacity:1}.happy .r-sad{opacity:0}
@keyframes breath{from{transform:scale(1,1)}to{transform:scale(1.006,1.014)}}
.hop{animation:hop .5s var(--ease-io)}
@keyframes hop{0%{transform:none}40%{transform:translateY(-7px)}100%{transform:none}}
.layer-globe{will-change:transform}
.land{transition:fill .6s var(--ease-out),stroke .6s var(--ease-out)}
.land{fill:#EEE5DC;stroke:#A39A91}
.on .land{fill:#FBF4EE;stroke:var(--ink)}
#sphereOn{opacity:0;transition:opacity .9s var(--ease-out)}.on #sphereOn{opacity:1}
.cloth{transform-box:fill-box;transform-origin:0% 50%;animation:flutter 1.8s var(--ease-io) infinite alternate}
@keyframes flutter{from{transform:scaleX(.965)}to{transform:none}}
.wave{animation:wave 1.7s linear infinite}
@keyframes wave{to{transform:translateX(24px)}}
.sh-on{opacity:0;transition:opacity .5s var(--ease-out)}.on .sh-on{opacity:1;transition:opacity .9s var(--ease-out) .45s}
.sh-off{transition:opacity .9s var(--ease-out) .2s}.on .sh-off{opacity:0;transition:opacity .4s var(--ease-out)}
.trail{stroke:var(--accent);stroke-width:1.6;fill:none;stroke-dasharray:3 6;stroke-linecap:round;animation:march 1.4s linear infinite;opacity:0;transition:opacity .4s}
.on .trail{opacity:.9}
@keyframes march{to{stroke-dashoffset:-18}}
.target{fill:none;stroke:var(--accent);stroke-width:1.6;animation:pulse 2.2s var(--ease-io) infinite;transform-box:fill-box;transform-origin:center}
.on .target,.moving .target{display:none}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.scene{cursor:pointer;-webkit-tap-highlight-color:transparent}.scene:focus{outline:none}.scene:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:24px}
.hint{text-align:center;font-size:14px;color:var(--muted);height:18px;position:relative;margin-top:2px}
.hint span{position:absolute;left:0;right:0}
.picker{position:relative;margin-top:30px;height:112px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - 39px);height:100%;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.c{flex:0 0 78px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;background:none;border:0;font:inherit;color:inherit;cursor:pointer;will-change:transform,opacity}
.c svg{border-radius:3px;box-shadow:0 0 0 1.4px var(--ink)}
.c b{font-size:13px;font-weight:500;white-space:nowrap;margin-top:2px}
.c em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;height:13px;transition:color .3s}
.c em.best{color:var(--text);font-weight:600}
body{touch-action:manipulation}.scene{-webkit-user-select:none;user-select:none}
#trailDot{opacity:0;transition:opacity .4s}.on #trailDot{opacity:.9}
.ticks{position:absolute;left:0;right:0;bottom:6px;height:10px;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 12px,var(--line) 12px 13.4px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.notch{position:absolute;left:50%;bottom:4px;width:2px;height:16px;margin-left:-1px;background:var(--accent);border-radius:1px}
.city{text-align:center;font-size:14px;font-weight:500;color:var(--text);height:18px;position:relative;margin-top:14px}
.city span{left:0;right:0}
.stats{position:absolute;left:24px;right:24px;bottom:44px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:16px}
.stats div{font-size:12px;color:var(--muted)}
.stats div:nth-child(2){text-align:center}.stats div:nth-child(3){text-align:right}
.stats b{display:block;margin-top:4px;font-size:17px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.stats i{font-style:normal;font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);z-index:2;transition:background-color .35s var(--ease-out)}
.on .homebar{transition:background-color .4s var(--ease-out) .62s}.compact .homebar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rabbit-breath{animation-duration:4.2s}
@media (prefers-reduced-motion:reduce){.ring{animation:none}.rabbit-breath,.cloth,.wave,.trail,.target{animation:none}.hop{animation:none}}
/* "Процесс" link: outside the phone on desktop, small pill in the empty top right corner on a real phone */
.proc{position:fixed;right:24px;bottom:24px;z-index:10;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 16px 0 18px;border-radius:22px;
  background:var(--off);color:var(--ink);text-decoration:none;font:500 15px/1 "Onest",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  box-shadow:inset 0 0 0 1px var(--line-off),0 10px 24px -14px rgba(70,45,20,.35);transition:transform .2s var(--ease-out),box-shadow .2s var(--ease-out)}
.proc:hover{box-shadow:inset 0 0 0 1px rgba(34,30,27,.38),0 12px 28px -14px rgba(70,45,20,.4)}
.proc:active{transform:scale(.97)}
.proc:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.proc svg{transition:transform .25s var(--ease-out)}.proc:hover svg{transform:translate(1.5px,-1.5px)}
body.band{padding-bottom:68px}
.meta{display:none}

@media (max-width:499px){
  /* real phone: the prototype fills the visible screen and the page simply goes on below it,
     like a normal site under the Safari toolbar. The link to the process lives there, outside the app */
  body{display:block;place-items:normal;min-height:0;overflow-x:hidden;overflow-y:auto;transition:background-color .35s var(--ease-out)}
  body.vpn-on{background:var(--on);transition:background-color .4s var(--ease-out) .55s}
  .proc{display:none}
  .phone.compact{padding-top:env(safe-area-inset-top)}
  .compact .stats{bottom:calc(18px + env(safe-area-inset-bottom))}
  .meta{display:block;position:relative;z-index:1;background:var(--surround);padding:28px 20px calc(32px + env(safe-area-inset-bottom));text-align:center;color:#6F655C;font:500 13px/1.4 "Onest",system-ui,sans-serif}
  .meta p{margin:0}
  .meta a{display:inline-flex;align-items:center;gap:6px;height:44px;margin:14px 0;padding:0 18px;border-radius:22px;background:var(--off);color:var(--ink);text-decoration:none;font-size:15px;box-shadow:inset 0 0 0 1px var(--line-off)}
  .meta a:active{opacity:.8}
}

/* one centered column: text, scene and countries sit in the middle between the status bar and the stats */
.phone{display:flex;flex-direction:column;padding-bottom:calc(var(--below) - 4px);--below:102px}
.phone.compact{--below:calc(72px + env(safe-area-inset-bottom))}
.sb,.scene,.picker{flex:none}
.state{text-align:center;padding:0;height:auto;margin-top:auto;flex:none}
.compact .state{padding-top:0;height:auto}
.label span,.sub span{left:0;right:0}
.hint{display:none}
.scene{margin-top:2px}
.picker{margin-top:32px;margin-bottom:auto}
.compact .picker{margin-top:24px}

const scene=$('scene');
scene.addEventListener('click',toggle);
scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
// parallax
let px=0,py=0,tx=0,ty=0;
app.addEventListener('pointermove',e=>{const r=app.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5);ty=((e.clientY-r.top)/r.height-.5)});
app.addEventListener('pointerleave',()=>{tx=0;ty=0});
// loop
(function loop(){
  if(document.hidden){requestAnimationFrame(loop);return}
  px+=(tx-px)*.06; py+=(ty-py)*.06;
  if(!RM){$('rabbit').style.transform=`translate3d(${(px*-6).toFixed(2)}px,${(py*-3).toFixed(2)}px,0)`;
    gOff={x:px*8,y:py*4}; $('globeLayer').setAttribute('transform',`translate(${gOff.x.toFixed(2)} ${gOff.y.toFixed(2)})`)}
  drawGlobe();
  if(hovering){pinState=hoverPt();applyPin(pinState)}
  else if(on&&!busy){pinState=pinOnGlobe();applyPin(pinState)}
  drawTrail();
  const ps=$('pinShadow'); const dd=Math.hypot(pinState.x-PIN_HOME.x,pinState.y-PIN_HOME.y); ps.style.opacity=Math.max(0,1-dd/40);
  requestAnimationFrame(loop);
})();
rot=rotFor(sel); render();
setTimeout(()=>{if(busy)return; runCheck().then(b=>{if(busy)return; if(pick===0){sel=b;flipFlag(b.id)} brakeTo(sel); render()})},700);
function fit(){
  const f=$('fit');
  if(innerWidth<500){
    document.body.classList.remove('band');
    const ah=Math.round($('svh').getBoundingClientRect().height)||innerHeight;
    const k=innerWidth/390, H=Math.round(ah/k);
    app.style.height=H+'px'; app.classList.toggle('compact',H<830); app.style.setProperty('--s',1);
    const pk=document.querySelector('.picker'), st=document.querySelector('.stats');
    const need=pk.offsetTop+pk.offsetHeight+20+st.offsetHeight+parseFloat(getComputedStyle(st).bottom);
    const sc=Math.max(.6,Math.min(1,(318-(need-H))/318)); app.style.setProperty('--s',sc.toFixed(3));
    f.style.width=innerWidth+'px'; f.style.height=ah+'px'; app.style.transform=`scale(${k})`;
  }else{
    app.style.height=''; app.classList.remove('compact'); app.style.setProperty('--s',1);
    let k=Math.min(1,(innerHeight-48)/844);
    // not enough room beside the phone for the Процесс link: give it its own strip below
    const tight=(innerWidth-390*k)/2<168; document.body.classList.toggle('band',tight); if(tight)k=Math.min(1,(innerHeight-48-68)/844);
    f.style.width=390*k+'px'; f.style.height=844*k+'px'; app.style.transform=`scale(${k})`;
  }
}
addEventListener('resize',fit);fit();
})();
</script>
</body>
</html>
